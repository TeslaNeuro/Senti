[project]
name = "senti"
version = "0.1.0"
description = "Local-first macOS visual assistant that understands what you are looking at."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Arshia Keshvari" },
]
requires-python = ">=3.11"
keywords = [
    "macos",
    "computer-vision",
    "yolo",
    "vlm",
    "privacy",
    "assistant",
    "ocr",
    "speech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://github.com/TeslaNeuro/Senti"
Repository = "https://github.com/TeslaNeuro/Senti"
Issues = "https://github.com/TeslaNeuro/Senti/issues"
License = "https://github.com/TeslaNeuro/Senti/blob/main/LICENSE"

[project.optional-dependencies]
mlx = [
    "yolo-mlx[tracking,convert]>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
